namespace: deisi

replicaCount: 1

image:
  repository: ghcr.io/afonso-saaa/horarios
  tag: "1.0.0"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  name: horarios
  type: NodePort
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  name: horarios
  className: traefik
  host: horarios.134.122.74.17.nip.io
  path: /
  pathType: Prefix

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

env:
  NODE_ENV: "production"